---
name: campus
provider: libvirt

defaults:
  devices:
    iosv.libvirt.image: cisco/iosv:15.9.M3
    iosv.warnings.paramiko: false
    iol.clab.image: asifsyd/cisco_iol:17.12.01

nodes:
  R1:
    device: iol
    provider: clab
  R2:
    device: iosv
  R3:
    device: iol
    provider: clab
  R4:
    device: iosv

links:
  - R1-R3
  - R2-R4
  - R1-R4
  - R2-R3
